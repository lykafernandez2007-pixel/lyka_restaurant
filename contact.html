<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Lyka's Restaurant for questions and inquiries.">
    <title>Lyka's Restaurant | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <a href="index.html">Lyka's Restaurant</a>
                </div>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="contact">
            <div class="container">
                <h1>Contact Us</h1>

                <p class="section-intro">
                    Have questions about our seafood menu? We would love
                    to hear from you.
                </p>

                <div class="contact-details">
                    <p><strong>Address:</strong> Brgy. Tiguma, Pagadian City</p>
                    <p><strong>Phone:</strong> (+63) 912-6693-938</p>
                    <p><strong>Email:</strong> lykarestaurant@gmail.com</p>
                </div>

                <form class="contact-form" action="#" method="post">
                    <label for="name">Enter your name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="message">Your Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                        required
                    ></textarea>

                    <button type="submit">Send Message</button>

                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Lyka's Restaurant. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
